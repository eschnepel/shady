[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shady"
version = "0.1.0"
description = "Shading-Adjusted PV Forecast - Passt einen bestehenden PV-Ertragsforecast anhand lokaler Verschattungseinflüsse an."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache 2.0" }
keywords = ["solar", "pv", "forecast", "shading", "home-assistant"]
dependencies = [
  "numpy>=1.26.0",
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "voluptuous",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.mypy]
python_version = "3.14"
mypy_path = "."
no_namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
# Deliberately pinned one Python feature-release behind
# `requires-python`/`[tool.mypy] python_version` (both 3.14): PEP 758
# (Python 3.14) made parentheses around a multi-exception `except`
# clause optional, and `ruff format` — inferring its target grammar
# from `requires-python` when `target-version` isn't set explicitly —
# was stripping the (still perfectly valid, just no longer mandatory)
# parentheses from every `except (A, B):` in this codebase. That
# unparenthesized form is real Python 3.14 syntax, not a mistake, but
# every dev/CI environment this project has actually been exercised
# in so far only has Python 3.12/3.13 available, where it's a hard
# `SyntaxError`. Pinning `ruff`'s own target-version to `py313` keeps
# the formatter emitting the parenthesized, 3.13-and-earlier-compatible
# form regardless of what `requires-python` says the *runtime* needs —
# a purely cosmetic choice for `ruff format`/`ruff check`, independent
# of what interpreter actually executes the code.
target-version = "py313"

[tool.ruff.lint]
extend-select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["custom_components"]
